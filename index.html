<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          var origError = console.error;
          console.error = function() {
            var msg = arguments[0];
            if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1)) {
              return;
            }
            origError.apply(console, arguments);
          };
          var origWarn = console.warn;
          console.warn = function() {
            var msg = arguments[0];
            if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1)) {
              return;
            }
            origWarn.apply(console, arguments);
          };
        }
      })();
    </script>
    <title>اتحاد ملاك عمارة التقوى</title>
    <meta name="description" content="نظام إدارة اتحاد ملاك عمارة التقوى لإدارة التحصيلات والمصروفات والسكان." />
    
    <!-- OpenGraph Metadata -->

    <meta property="og:type" content="website" />

    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
