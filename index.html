<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          var origError = console.error;
          console.error = function() {
            var msg = arguments[0];
            if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1)) {
              return;
            }
            origError.apply(console, arguments);
          };
          var origWarn = console.warn;
          console.warn = function() {
            var msg = arguments[0];
            if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1)) {
              return;
            }
            origWarn.apply(console, arguments);
          };
        }
      })();
    </script>
    <title>اتحاد الملاك</title>
    <meta name="description" content="نظام ذكي متكامل لإدارة شؤون وماليات اتحاد الملاك." />

          <svg style="width: 36px; height: 36px; fill: none; stroke: #ffffff; stroke-width: 2;" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
