<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <!-- Background circle with blue gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="8" />
  
  <!-- Stylized Pyramids -->
  <!-- Left/Back Pyramid -->
  <polygon points="120,380 200,240 280,380" fill="#1e293b" opacity="0.6" />
  <polygon points="200,240 280,380 240,380" fill="#0f172a" opacity="0.4" />

  <!-- Right/Front Big Pyramid -->
  <polygon points="200,380 320,180 440,380" fill="url(#goldGrad)" />
  <polygon points="320,180 440,380 380,380" fill="#d97706" />

  <!-- Stylized Modern Building/Tower coming out of the pyramid -->
  <rect x="230" y="220" width="50" height="160" fill="#ffffff" rx="4" />
  <rect x="240" y="240" width="10" height="20" fill="#3b82f6" rx="1" />
  <rect x="260" y="240" width="10" height="20" fill="#3b82f6" rx="1" />
  <rect x="240" y="270" width="10" height="20" fill="#3b82f6" rx="1" />
  <rect x="260" y="270" width="10" height="20" fill="#3b82f6" rx="1" />
  <rect x="240" y="300" width="10" height="20" fill="#3b82f6" rx="1" />
  <rect x="260" y="300" width="10" height="20" fill="#3b82f6" rx="1" />
  <rect x="240" y="330" width="10" height="20" fill="#3b82f6" rx="1" />
  <rect x="260" y="330" width="10" height="20" fill="#3b82f6" rx="1" />

  <!-- App Title Text Stylized (optional inside icon, but looks great for splash screen) -->
  <path d="M150,380 L370,380" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
</svg>
